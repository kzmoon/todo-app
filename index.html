<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>待办事项</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f7fb; color: #222; max-width: 560px; margin: 40px auto; }
    input { padding: 8px; width: 60%; }
    button { padding: 8px 14px; }
    li { margin: 8px 0; }
  </style>
</head>
<body>
  <h1>待办事项</h1>
  <p class="tips">小贴士：先输入内容再点添加</p>
  <p class="notice">课程练习版本</p>
  <input id="todo" placeholder="要做什么？">
  <button onclick="addTodo()">添加待办</button>
  <button id="sort">按截止时间排序</button>
  <button id="complete">全部完成</button>
  <p>截止时间:<input type="date" id="due-date"></p>
  <p id="due-save">保存截止时间:点击添加时一起保存</p>
  <p id="due-alert">过期提醒:截止时间已过</p>
  <ul id="list"></ul>
  <script>
    const todos = [];
    function addTodo() {
      const input = document.querySelector('#todo');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text: text, done: false });
      input.value = '';
      render();
    }
    function render() {
      document.querySelector('#list').innerHTML = todos
        .map(t => `<li>${t.done ? '✅' : '⬜'} ${t.text}</li>`)
        .join('');
    }
  </script>
</body>
</html>
